# mcp-ops 示例配置
# 明文凭据仅适用于开发/测试环境；上生产前请收紧文件权限并考虑加密存储。

# ---- 大模型（host 使用）----
llm:
  provider: openai            # openai | anthropic
  openai:                     # OpenAI 兼容：OpenAI/DeepSeek/Qwen/GLM/Kimi/Ollama/vLLM 通用
    base_url: https://api.deepseek.com/v1
    api_key: sk-xxx
    model: deepseek-chat
  anthropic:                  # Anthropic 原生协议（provider 改为 anthropic 时生效）
    base_url: https://api.anthropic.com
    api_key: sk-ant-xxx
    model: claude-sonnet-4-20250514
  max_turns: 30               # Agent 循环最大轮数（防失控）
  system_prompt: ""           # 留空使用内置默认运维提示词

# ---- 两个 MCP Server（Streamable HTTP + Bearer token）----
ssh_server:
  listen: 127.0.0.1:8801
  token: dev-token-ssh
db_server:
  listen: 127.0.0.1:8802
  token: dev-token-db
web_server:
  listen: 127.0.0.1:8803
  token: dev-token-web

# ---- 网页抓取行为（fetch_url 工具）----
# 全部有安全默认值，整段可省略。
web_fetch:
  user_agent: "mcp-ops/0.1 (Autonomous Agent)"  # 明确标识自动化抓取，便于站点管理员识别
  timeout: 30s
  max_bytes: 10485760          # 响应体上限 10 MiB，超出报错而不是截断
  max_redirects: 5             # 每跳都会重新做 SSRF 与 robots 校验
  respect_robots: true         # 遵守 robots.txt；确认站点允许自动化访问再设为 false
  allow_private: false         # 拒绝环回/私网/CGNAT/云元数据地址；读内网页面时才设 true
  cache_ttl: 5m                # 同一 URL 5 分钟内复用缓存；写 0s 关闭
  max_length: 20000            # 单次返回字符数，长页用 start_index 续读
  max_concurrent: 8            # 并发抓取上限，避免打爆目标站
  default_headers: {}          # 需要登录态时才用，例如 {"Cookie": "session=..."}

# ---- Go 原生内置的 7 个官方 server 替代实现（无需 npx/node 外部依赖）----
# filesystem / memory / sequential-thinking / everything / fetch / git /
# playwright 已原生编译进 opsctl 单二进制，开箱即用。
# 浏览器自动化统一为 playwright 一套（原 chrome-devtools 能力已并入）。
# 整段可省略，全部走默认值。
builtins:
  filesystem:
    allowed_directories:       # 限定文件工具可访问的根目录（防路径穿越 / symlink 逃逸）
      - .
  memory:
    storage_path: ./.memory.json   # 知识图谱持久化文件（跨会话保留）
  git:
    default_repo: .            # git 工具默认仓库；留空则每个工具都要显式传 repo_path
  browser:
    executable_path: /usr/bin/google-chrome   # 浏览器可执行文件；留空自动探测
    headless: true                             # 无头模式（调试时改 false）
    # user_data_dir: ~/.cache/mcp-ops-browser  # 复用登录态（可选）

# ---- Postman 本地测试引擎（解析 Collection v2.1 + 环境文件，跑请求与断言）----
# 整段可省略；collection/environment 也可在工具调用时直接传文件路径。
postman:
  timeout: 30s                   # 单请求超时，默认 30s
  collections:                   # 预置 collection 清单（name 供工具按名引用）
    # - name: api-tests
    #   path: ./tests/api.collection.json
  environments:                  # 预置 environment 清单（提供 {{变量}}）
    # - name: dev
    #   path: ./tests/dev.environment.json

# ---- SSH 主机清单 ----
ssh_hosts:
  - name: web1
    host: 192.168.1.10
    port: 22
    user: root
    auth:
      private_key: ~/.ssh/id_rsa   # 私钥路径；或 private_key_data 内嵌 PEM / password / agent: true
    allowed_commands:              # 命令前缀白名单（token 边界匹配）
      - df
      - free
      - uptime
      - docker ps
      - docker stats
      - systemctl status
      - journalctl
      - tail
      - cat /var/log
    # 想放行全部命令？把 allowed_commands 替换为 ["*"]（危险命令黑名单仍然生效，
    # 例如 rm -rf / mkfs / shutdown 仍会被拒绝）。仅建议开发/测试环境使用。
    command_timeout: 120s

  - name: db-vm
    host: 192.168.1.20
    port: 22
    user: ops
    auth:
      password: "123456"           # 仅开发环境建议
    allowed_commands:
      - df
      - free
      - uptime

# ---- 数据库清单 ----
databases:
  - name: main-mysql
    type: mysql
    host: 127.0.0.1
    port: 3306
    user: root
    password: "secret"
    database: appdb
    query_timeout: 30s

  - name: inner-pg                 # 内网 PG：经 web1 的 SSH 隧道连接
    type: postgres
    host: 10.0.0.5                 # SSH 主机视角的内网地址
    port: 5432
    user: postgres
    password: "secret"
    database: analytics
    via_ssh: web1
    query_timeout: 60s

  - name: logs-mongo
    type: mongodb
    host: 127.0.0.1
    port: 27017
    user: admin
    password: "secret"
    database: logs

  - name: cache-redis
    type: redis
    host: 127.0.0.1
    port: 6379
    password: ""
    database: "0"                  # Redis db 编号（字符串形式）

  - name: search-es
    type: elasticsearch
    host: 127.0.0.1                # 需要https时写 https://es.example.com
    port: 9200
    user: elastic
    password: "secret"

  - name: app-tidb
    type: tidb                     # TiDB 完全兼容 MySQL 协议，复用 MySQL 驱动
    host: 127.0.0.1
    port: 4000                     # TiDB 默认端口 4000
    user: root
    password: ""
    database: appdb
    query_timeout: 30s

  - name: local-sqlite
    type: sqlite                   # SQLite 文件数据库，无 host/port，文件路径写在 database
    database: /data/app.db         # 也可写 :memory: 使用内存库，或改用 dsn 写完整路径
    query_timeout: 10s

# ---- 额外的外部 MCP Server（host 通过 stdio 子进程挂载，可任意添加）----
# 注意：filesystem / memory / sequential-thinking / everything / fetch / git /
# playwright 这 7 个已由上面的 builtins 段原生内置，无需
# 在此再挂一遍。本段用于挂载 builtins 之外的任意 stdio server（例如自建服务、
# 其他社区 server、或隔离运行的 opsctl stdio）。
#
# host 启动时会用 command + args 拉起每个子进程，完成 MCP 握手后把它们的
# 工具与内置工具合并。工具名冲突时自动加 "<server名>__" 前缀。
#
# disabled: true 可临时停用某个 server；env 可附加环境变量（如 {"PATH": "/extra/bin"}）
mcp_servers:
  # 示例：再次拉起 opsctl stdio（把内置工具当外部 server 隔离运行）
  # - name: opsctl-isolated
  #   command: /opt/mcp-ops/bin/opsctl
  #   args: ["stdio", "-config", "/opt/mcp-ops/config.yaml"]
